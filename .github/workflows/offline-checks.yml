name: Offline code checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: electron
        shell: bash
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official ref
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified official ref
        with:
          node-version: '22.22.0' # Match the currently tested Node 22 patch
          package-manager-cache: false
      - name: Install both locked dependency trees without lifecycle scripts
        id: dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix minecraft-runtime --ignore-scripts
      - name: Lint full host and Minecraft engine
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck
      - name: Local runtime installer tests (complete suite)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:minecraft:setup
      - name: Host tests (full suite)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test
      - name: Security tests (full suite)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:security
      - name: Legacy acceptance support tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:minecraft:acceptance
      - name: Original complete runtime npm test (no filter or forced exit)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test --prefix minecraft-runtime
      - name: Confirm tracked files unchanged
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git diff --exit-code HEAD --
